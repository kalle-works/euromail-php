name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: kalle-works/.github/.github/workflows/semantic-release.yml@77524aa234c999f285b1c6d192d62df02ff39bf8 # main
    with:
      runner: kalle-works-arm64
    permissions:
      contents: write
      issues: write
      pull-requests: write
